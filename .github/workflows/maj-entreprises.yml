name: Mise à jour des entreprises

on:
  schedule:
    - cron: "0 5 * * 1" # chaque lundi à 05:00 UTC
  workflow_dispatch: # lancement manuel depuis l'onglet Actions

permissions:
  contents: write
  pages: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python recuperer_entreprises.py
      - name: Enregistrer et republier si les données ont changé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- entreprises.geojson; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mise à jour des entreprises" entreprises.geojson
          git push
          # Un push fait par Actions ne relance pas GitHub Pages tout seul
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"
